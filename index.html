<!DOCTYPE html>

<style>
body {

}

h1 {

table {
  margin: 0 auto 40px;

  border-spacing: 4px;

  border: 2px solid #efc3d1;
}

  background-color: #d4789a;
  color: white;
  font-family: Arial, sans-serif;

}

td {
  background-color: #fce6ec;
  color: #9c3a60;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  height: 50px;
}

.today:hover {
  background-color: #c95b84;
}

.today a {
  color: #9c3a60;
  text-decoration: none;
  display: block;
  padding: 13px 0;
}

.today:hover a {
  color: white;
}
</style>
